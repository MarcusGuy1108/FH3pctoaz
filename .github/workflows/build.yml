name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create, e.g. v1.0.0 (empty: build only)"
        required: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Mono
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mono-devel

      - name: Test
        run: bash tests/run-tests.sh

      - name: Build
        run: bash build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: AzimuthSaveImporter
          path: dist/AzimuthSaveImporter.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AzimuthSaveImporter.exe
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
